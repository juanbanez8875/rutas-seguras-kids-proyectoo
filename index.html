<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rutas Seguras Kids</title>
</head>
<body>
    <h1>Gestión de Rutas Escolares</h1>
    
    <form id="form-ruta">
        <input type="text" id="nombre-ruta" placeholder="Nombre de la ruta (Ej: Norte)" required>
        <input type="text" id="conductor" placeholder="Nombre del conductor" required>
        <input type="time" id="hora-salida" required>
        <button type="submit">Crear Ruta</button>
    </form>

    <div id="contenedor-rutas"></div>

    <script src="script.js"></script>
</body>
</html>
